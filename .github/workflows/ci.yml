name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENTINEL_ENVIRONMENT: ci
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinel_test
      # Database-backed tests use this database; without it they would skip.
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --project apps/api --frozen

      - name: Ruff format
        run: uv run --project apps/api ruff format --check .

      - name: Ruff lint
        run: uv run --project apps/api ruff check .

      - name: mypy (app and tests)
        working-directory: apps/api
        run: uv run mypy

      - name: mypy (scripts)
        env:
          MYPYPATH: apps/api
        run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml scripts

      - name: pytest
        working-directory: apps/api
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Alembic migrations apply and roll back on PostGIS
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

  schemas:
    name: Shared schemas are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: uv sync --project apps/api --frozen
      - run: npm ci

      - name: Regenerate OpenAPI and TypeScript types
        run: |
          uv run --project apps/api python scripts/export_openapi.py
          npm run schemas:generate

      - name: Fail if the committed schemas are stale
        run: |
          if ! git diff --exit-code -- packages/shared-schemas; then
            echo "::error::Shared schemas are out of date. Run 'make schemas' and commit the result."
            exit 1
          fi
