name: sentinel-planner

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
      target: dev
    environment:
      SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-local}
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
      SENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@db:5432/${POSTGRES_DB:-sentinel}
      SENTINEL_DATA_DIR: /srv/data
      SENTINEL_CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Source is mounted for reload; the virtualenv lives in /opt/venv, inside
      # the image, so it is not shadowed by this mount.
      - ./apps/api:/srv/api
      # Datasets live outside the image and survive rebuilds.
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
      target: dev
    command: ["python", "-m", "app.workers.viewshed_worker"]
    environment:
      SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-local}
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
      SENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@db:5432/${POSTGRES_DB:-sentinel}
      SENTINEL_DATA_DIR: /srv/data
    volumes:
      - ./apps/api:/srv/api
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      # Browser calls go to the published port, server components use the
      # compose network name.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
      API_BASE_URL: http://api:8000
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/srv/apps/web
      - ./packages:/srv/packages
      - /srv/node_modules
      - /srv/apps/web/.next
    depends_on:
      - api

volumes:
  db-data:
